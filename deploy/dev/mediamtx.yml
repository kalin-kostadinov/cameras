# MediaMTX for local development: five fake cameras generated by ffmpeg.
# Unlisted settings use MediaMTX defaults.
logLevel: info

api: yes
apiAddress: :9997

rtspAddress: :8554
rtmp: no
srt: no
webrtc: no

hls: yes
hlsAddress: :8888
# Standard fMP4 HLS (not low-latency): far fewer requests per viewer, each of which
# passes through Caddy forward_auth. Expect ~3–6 s delay.
hlsVariant: fmp4
hlsSegmentDuration: 1s

playback: yes
playbackAddress: :9996

# Dev only: anyone may do anything. Production restricts by IP (see deploy/home).
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

pathDefaults:
  record: yes
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  # Short segments so playback can be tried within minutes.
  recordSegmentDuration: 1m
  recordDeleteAfter: 1d

paths:
  home-entrance:
    runOnInit: ffmpeg -re -f lavfi -i testsrc2=size=1280x720:rate=15 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 30 -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  home-parking:
    runOnInit: ffmpeg -re -f lavfi -i testsrc=size=1280x720:rate=15 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 30 -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  home-door:
    runOnInit: ffmpeg -re -f lavfi -i smptehdbars=size=1280x720:rate=15 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 30 -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  studio-door:
    runOnInit: ffmpeg -re -f lavfi -i mandelbrot=size=1280x720:rate=15 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 30 -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  studio-inside:
    runOnInit: ffmpeg -re -f lavfi -i rgbtestsrc=size=1280x720:rate=15 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 30 -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes

  # "Sub-streams": real cameras provide a low-bitrate stream2; here we simply re-serve the main stream.
  home-entrance-sub:
    source: rtsp://localhost:8554/home-entrance
    record: no
  home-parking-sub:
    source: rtsp://localhost:8554/home-parking
    record: no
  home-door-sub:
    source: rtsp://localhost:8554/home-door
    record: no
  studio-door-sub:
    source: rtsp://localhost:8554/studio-door
    record: no
  studio-inside-sub:
    source: rtsp://localhost:8554/studio-inside
    record: no
