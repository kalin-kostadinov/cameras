<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Groups')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <nav th:replace="~{fragments :: adminnav}"></nav>
    <div th:replace="~{fragments :: flash}"></div>

    <table>
        <thead><tr><th>Group</th></tr></thead>
        <tbody>
        <tr th:each="g : ${groups}">
            <td><a th:href="@{/admin/groups/{id}(id=${g.id})}" th:text="${g.name}">group</a></td>
        </tr>
        </tbody>
    </table>

    <h2>Add group</h2>
    <form class="formrow" th:action="@{/admin/groups}" method="post">
        <label>Name <input name="name" required maxlength="64"></label>
        <button type="submit">Add</button>
    </form>
</main>
</body>
</html>
