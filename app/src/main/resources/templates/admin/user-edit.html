<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${user.username})}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <nav th:replace="~{fragments :: adminnav}"></nav>
    <div th:replace="~{fragments :: flash}"></div>

    <h1 th:text="${user.username}">user</h1>
    <form class="stack" th:action="@{/admin/users/{id}(id=${user.id})}" method="post">
        <label>Name <input name="displayName" th:value="${user.displayName}"></label>
        <label>Role
            <select name="role">
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == user.role}"></option>
            </select>
        </label>
        <label class="check"><input type="checkbox" name="enabled" value="true" th:checked="${user.enabled}"> Active</label>
        <label>New password <span class="muted small">(leave empty to keep)</span>
            <input name="newPassword" type="password" minlength="10" autocomplete="new-password">
        </label>
        <button type="submit">Save</button>
    </form>

    <h2>Groups</h2>
    <p th:if="${user.role.name() == 'ADMIN'}" class="muted">Admins see every camera.</p>
    <p th:if="${#lists.isEmpty(userGroups)}" class="muted">Not in any group.</p>
    <ul>
        <li th:each="g : ${userGroups}"><a th:href="@{/admin/groups/{id}(id=${g.id})}" th:text="${g.name}">group</a></li>
    </ul>

    <h2>Delete</h2>
    <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post"
          onsubmit="return confirm('Delete this user?')">
        <button type="submit" class="danger">Delete user</button>
    </form>
</main>
</body>
</html>
