<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body class="center">
<main class="card login">
    <h1>● Cameras</h1>
    <p class="flash err" th:if="${param.error}">Wrong username or password.</p>
    <p class="flash ok" th:if="${param.logout}">You have signed out.</p>
    <form th:action="@{/login}" method="post">
        <label>Username <input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <label class="check"><input type="checkbox" name="remember-me" checked> Keep me signed in</label>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
